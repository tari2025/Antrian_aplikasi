{% extends "base.html" %}{% block c %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card">
      <div class="card-body">
        <h4>Masuk</h4>
        <form method="post">
          <input
            name="username"
            class="form-control mb-2"
            placeholder="Username"
            required
          />
          <input
            name="password"
            type="password"
            class="form-control mb-3"
            placeholder="Password"
            required
          />
          <button class="btn btn-primary w-100">Masuk</button>
        </form>
        <hr />
        <div class="small text-muted">
          Akun demo (password <b>123</b>):<br />
          client1, client2 &bull; analyst1 &bull; leader1 &bull; prog1, prog2,
          prog3
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %} //tugas
